# service.endpoint has no default and answers no flag. Point it at a
# Responses-compatible API before running aritu on this repository.
#
# service:
#   endpoint: https://gateway.internal/v1
#   auth_token_var: ARITU_TOKEN

votes: 1

# The built-in tests kind is every test file anywhere, which here would include the
# fixtures — and a fail- fixture is a bad test on purpose. So this repository gives
# its own answer to what a test file of its own is.
targets:
  tests:
    - 'internal/**/*_test.go'
    - 'cmd/**/*_test.go'
